services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: cskv
      POSTGRES_USER: cskv
      POSTGRES_PASSWORD: cskv_local
    ports:
      - "5434:5432"
    volumes:
      - cskv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cskv -d cskv"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cskv_postgres_data:
